[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-engine"
version = "0.1.0"
description = "Strukturovana kontextova pamat — MCP server pre Life OS"
requires-python = ">=3.11"
dependencies = [
    # Pinned below 2.0 on purpose. mcp 2.x renamed FastMCP to MCPServer, so
    # `from mcp.server.fastmcp import FastMCP` (server.py, combined_server.py)
    # raises ModuleNotFoundError on 2.x. mcp 2.x also dropped the
    # pydantic-settings dependency that mcp-oauth imports but does not declare,
    # so an unpinned rebuild breaks twice over.
    "mcp>=1.0,<2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",  # imported by mcp-oauth, not declared by it
    "mcp-oauth>=0.0.6",
    "sqlite-vec>=0.1.6",
    "voyageai>=0.3.2",
    # pysqlite3 — modern SQLite with extension support (stdlib sqlite3 on macOS lacks it)
    # Linux gets the binary wheel; macOS builds from source (sqlite headers via Xcode CLT).
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
    "pysqlite3>=0.5.4; platform_system == 'Darwin'",
]

[project.scripts]
context-engine = "context_engine.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
